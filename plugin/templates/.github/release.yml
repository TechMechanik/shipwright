# Categories for GitHub's generated release notes (gh release create --generate-notes).
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: Features
      labels: [enhancement]
    - title: Fixes
      labels: [bug]
    - title: Security
      labels: [security]
    - title: Dependency updates
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]
